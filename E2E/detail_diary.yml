appId: morimori.Macho
---
# 日記リスト画面が表示されているときに実行すること
- tapOn: "日記項目ボタン"
- assertVisible: "Detail"
- assertVisible: "Edit"
# 日記内容の確認
- assertVisible: "${TITLE}"
- assertVisible: "${MESSAGE}"
- assertVisible: "${TAG_NAME}"
- assertVisible: "${ACHIVE_STATUS}"
- assertVisible: "種目数：1"
- assertVisible: "${TRAINING_TYPE_NAME}"
- assertVisible: "目標:${COUNT_PER_SET}セット${SET_COUNT}回"
- assertVisible: "達成セット数: ${ACHIVE_SET_COUNT}"
