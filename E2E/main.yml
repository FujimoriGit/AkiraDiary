appId: morimori.Macho
---
# 初期状態にする
- clearState: "morimori.Macho"
# Macho起動
- launchApp: "morimori.Macho"

# 初期状態の日記リストを確認
- runFlow: "initial_diary_list.yml"

# 日記作成画面の確認
- runFlow: "creation_diary.yml"

# 作成した日記を削除できることを確認
- runFlow: "delete_diary.yml"

# 日記の編集を確認
- runFlow: "creation_diary.yml"
- runFlow: "edit_diary/edit_diary.yml"

# 日記リストのフィルター画面を確認
- runFlow:
    file: "filter_diary_list.yml"
    env:
      ACHIEVE_STATUE: "達成している"
      TRAINING_TYPE_NAME: "TestTrainingType"
      TAG_NAME: "TestTag"

# 日記詳細画面確認
- runFlow:
    file: "detail_diary.yml"
    env:
      TITLE: "TestTitle2"
      MESSAGE: "TestMessage2"
      ACHIVE_STATUS: "Win"
      TAG_NAME: "TestTag"
      TRAINING_TYPE_NAME: "TestTrainingType"
      COUNT_PER_SET: "3"
      SET_COUNT: "3"
      ACHIVE_SET_COUNT: "3"
