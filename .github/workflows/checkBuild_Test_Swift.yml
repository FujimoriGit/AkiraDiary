# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: CheckBuild_Test_Swift

on:
  pull_request:
    branches:
      - "BR_develop**"
      - "BR_topic/**"
    paths-ignore:
      - "doc/*"
      - "wiki/**"
      - README.md
  issue_comment:
    types: [created, edited, deleted]

env:
  # チェックアウト
  DEVELOPER_DIR: /Applications/Xcode_16.1.app
  WORKSPACE_DIR: ./Macho/Macho.xcworkspace

jobs:
  build:
    if: ${{ github.event.issue.pull_request && github.event.comment.body == 'test-this-please' || !github.event.issue.pull_request }}
    # 実行環境はmacosに設定
    runs-on: macos-latest

    steps:
      # チェックアウト(リポジトリからソースコードを取得)
      - uses: actions/checkout@v4.2.2

      # Xcodeの一覧出力
      - name: Show Xcode list
        run: ls /Applications | grep 'Xcode'

      # Xcodeのバージョン選択
      - name: Select Xcode version
        run: sudo xcode-select -s '${{ env.DEVELOPER_DIR }}/Contents/Developer'

      # Xcodeのバージョン出力
      - name: Show Xcode version
        run: xcodebuild -version

      # Rudy製ライブラリのキャッシュ
      - name: Cache Gems
        uses: actions/cache@v4.1.1
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      # Rudy製ライブラリのインストール
      - name: Install Bundled Gems
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3

      # SPMのライブラリのキャッシュ
      - name: Cache Swift Packages
        uses: actions/cache@v4.1.1
        with:
          path: SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('*.xcodeproj/project.xcworkspace/ xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      # ビルド
      - name: Xcode build
        run: set -o pipefail &&
          xcodebuild
          -workspace ${WORKSPACE_DIR}
          -scheme Macho
          -destination 'platform=iOS Simulator,OS=18.1,name=iPhone 16 Pro'
          -configuration Debug
          -clonedSourcePackagesDirPath SourcePackages
          -skipPackagePluginValidation
          -skipMacroValidation
          -scmProvider xcode
          clean build |
          bundle exec xcpretty

      # 単体テストの実行
      - name: Xcode test
        run: xcodebuild
          -workspace ${WORKSPACE_DIR}
          -configuration Debug
          -destination 'platform=iOS Simulator,OS=18.1,name=iPhone 16 Pro'
          -scheme Macho
          -testPlan Macho
          -skipPackagePluginValidation
          -skipMacroValidation
          -scmProvider xcode
          -skip-testing MachoUITests
          -clonedSourcePackagesDirPath SourcePackages
          clean test |
          bundle exec xcpretty --report html

      - name: Upload test result
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports
