# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: CheckBuild_Test_Swift

on:
  pull_request:
    branches:
      - "BR_develop**"
      - "BR_topic/**"
    paths-ignore:
      - "doc/*"
      - "wiki/**"
      - README.md
  issue_comment:
    types: [created, edited, deleted]

env:
  # チェックアウト
  DEVELOPER_DIR: /Applications/Xcode_16.1.app

jobs:
  determine-test-scheme:
    runs-on: ubuntu-latest
    outputs:
      test_scheme: ${{ steps.set-scheme.outputs.scheme }}
    steps:
      - uses: actions/checkout@v4.2.2
      - id: set-scheme
        run: |
          MODEL_CHANGED=false
          VIEW_CHANGED=false
          TARGET_REF="${{ github.event.pull_request.base.sha }}"
          CURRENT_REF=${{ github.sha }}
          for file in $(git diff --name-only $TARGET_REF $CURRENT_REF); do
            if [[ $file == Macho/MachoFramework/Sources/MachoModel/* ]] || [[ $file == Macho/MachoFramework/Tests/MachoModelTests/* ]] || [[ $file == Macho/MachoFramework/Sources/RealmHelper/* ]]; then
              MODEL_CHANGED=true
            fi
            if [[ $file == Macho/MachoFramework/Sources/MachoView/* ]] || [[ $file == Macho/MachoFramework/Tests/MachoViewTests/* ]]; then
              VIEW_CHANGED=true
            fi
            if [[ $file == Macho/MachoFramework/Sources/MachoCore/* ]]; then
              VIEW_CHANGED=true
              MODEL_CHANGED=true
            fi
            if $MODEL_CHANGED && $VIEW_CHANGED; then
              break
            fi
          done
          if $MODEL_CHANGED && $VIEW_CHANGED; then
            echo "scheme=MachoFrameWork" >> $GITHUB_OUTPUT
          elif $MODEL_CHANGED; then
            echo "scheme=MachoModelTest" >> $GITHUB_OUTPUT
          elif $VIEW_CHANGED; then
            echo "scheme=MachoViewTest" >> $GITHUB_OUTPUT
          else
            echo "scheme=" >> $GITHUB_OUTPUT
          fi

  build:
    if: ${{ github.event.issue.pull_request && github.event.comment.body == 'test-this-please' || !github.event.issue.pull_request }}
    # 実行環境はmacosに設定
    runs-on: macos-latest
    needs: determine-test-scheme
    steps:
      # チェックアウト(リポジトリからソースコードを取得)
      - uses: actions/checkout@v4.2.2

      # Xcodeの一覧出力
      - name: Show Xcode list
        run: ls /Applications | grep 'Xcode'

      # Xcodeのバージョン選択
      - name: Select Xcode version
        run: sudo xcode-select -s '${{ env.DEVELOPER_DIR }}/Contents/Developer'

      # Xcodeのバージョン出力
      - name: Show Xcode version
        run: xcodebuild -version

      # Rudy製ライブラリのキャッシュ
      - name: Cache Gems
        uses: actions/cache@v4.1.1
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      # Rudy製ライブラリのインストール
      - name: Install Bundled Gems
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3

      # SPMのライブラリのキャッシュ
      - name: Cache Swift Packages
        uses: actions/cache@v4.1.1
        with:
          path: SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('*.xcodeproj/project.xcworkspace/ xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      # ビルド
      - name: Xcode build
        run: set -o pipefail &&
          xcodebuild
          -workspace ./Macho/Macho.xcworkspace
          -scheme Macho
          -destination 'platform=iOS Simulator,OS=18.1,name=iPhone 16 Pro'
          -configuration Debug
          -clonedSourcePackagesDirPath SourcePackages
          -skipPackagePluginValidation
          -skipMacroValidation
          -scmProvider xcode
          clean build |
          bundle exec xcpretty

      # 単体テストの実行
      - name: Xcode test
        working-directory: ./Macho
        run: set -o pipefail &&
          xcodebuild
          -configuration Debug
          -destination 'platform=iOS Simulator,OS=18.1,name=iPhone 16 Pro'
          -scheme ${{ needs.determine-test-scheme.outputs.test_scheme }}
          -skipPackagePluginValidation
          -skipMacroValidation
          -scmProvider xcode
          -skip-testing:MachoUITests
          -clonedSourcePackagesDirPath SourcePackages
          clean test |
          bundle exec xcpretty
