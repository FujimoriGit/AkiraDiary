# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: CheckBuild_Test_Swift

on:
  pull_request:
    branches:
      - "BR_develop**"
      - "BR_topic/**"
    paths-ignore:
      - "doc/*"
      - "wiki/**"
      - README.md
  issue_comment:
    types: [created, edited, deleted]

env:
  # チェックアウト
  DEVELOPER_DIR: /Applications/Xcode_16.1.app
  WORKSPACE_DIR: ./Macho/Macho.xcworkspace

jobs:
  build:
    if: ${{ github.event.issue.pull_request && github.event.comment.body == 'test-this-please' || !github.event.issue.pull_request }}
    # 実行環境はmacosに設定
    runs-on: macos-latest

    steps:
      # チェックアウト(リポジトリからソースコードを取得)
      - uses: actions/checkout@v4.2.2

      # Xcodeの一覧出力
      - name: Show Xcode list
        run: ls /Applications | grep 'Xcode'

      # Xcodeのバージョン選択
      - name: Select Xcode version
        run: sudo xcode-select -s '${{ env.DEVELOPER_DIR }}/Contents/Developer'

      # Xcodeのバージョン出力
      - name: Show Xcode version
        run: xcodebuild -version

      # xcbeautifyをインストール
      - name: Install xcbeautify
        run: brew install xcbeautify

      # DangerJSをインストール
      - name: Install Dnager JS
        run: npm install -g danger

      # SPMのライブラリのキャッシュ
      - name: Cache Swift Packages
        uses: actions/cache@v4.1.1
        with:
          path: SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('*.xcodeproj/project.xcworkspace/ xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      # ビルド
      - name: Xcode Resolve Package Dependencies
        run: set -o pipefail &&
          xcodebuild
          -workspace ${WORKSPACE_DIR}
          -scheme Macho
          -configuration Debug
          -clonedSourcePackagesDirPath SourcePackages
          -skipPackagePluginValidation
          -skipMacroValidation
          -scmProvider xcode
          -resolvePackageDependencies

      # 単体テストの実行
      - name: Xcode test
        run: set -o pipefail &&
          xcodebuild
          -workspace ${WORKSPACE_DIR}
          -configuration Debug
          -destination 'platform=iOS Simulator,OS=18.1,name=iPhone 16 Pro'
          -scheme Macho
          -testPlan Macho
          -skipPackagePluginValidation
          -skipMacroValidation
          -scmProvider xcode
          -skip-testing MachoUITests
          -clonedSourcePackagesDirPath SourcePackages
          -resultBundlePath 'Build/test.xcresult'
          -enableCodeCoverage YES
          clean test |
          xcbeautify --renderer github-actions

      # テスト結果の確認
      - name: Check Test Coverage
        run: swift run danger-swift ci --dangerfile Dangerfile_after_build.swift
        env:
          GITHUB_TOKEN: ${{ secrets.DANGER_GITHUB_TOKEN }}
